<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%">
  <defs>
    <linearGradient id="rsaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="encGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="decGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <marker id="rsaArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="540" fill="#0F172A" rx="16" />

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">
    RSA Public-Key Cryptosystem Architecture
  </text>
  <text x="500" y="66" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">
    Asymmetric Encryption, Decryption, and Mathematical Trapdoor Function
  </text>

  <!-- Stage 1: Key Generation -->
  <rect x="40" y="95" width="280" height="400" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="40" y="95" width="280" height="42" rx="12" fill="url(#rsaGrad)" />
  <text x="180" y="122" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">
    1. Key Generation
  </text>

  <g transform="translate(55, 150)">
    <text x="0" y="15" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Select two distinct large primes:</text>
    <rect x="0" y="25" width="250" height="28" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#60A5FA">p, q (Secret Primes)</text>

    <text x="0" y="75" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Compute Modulus &amp; Totient:</text>
    <rect x="0" y="85" width="250" height="50" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">N = p · q (Public)</text>
    <text x="125" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#F87171">φ(N) = (p - 1)(q - 1) (Secret)</text>

    <text x="0" y="155" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Select Public Exponent e:</text>
    <rect x="0" y="165" width="250" height="30" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#FCD34D">gcd(e, φ(N)) = 1,  1 &lt; e &lt; φ(N)</text>

    <text x="0" y="215" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Compute Private Exponent d:</text>
    <rect x="0" y="225" width="250" height="30" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="245" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#34D399">d ≡ e^(-1) (mod φ(N))</text>

    <!-- Key Output Summary -->
    <rect x="0" y="270" width="250" height="60" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <text x="125" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#38BDF8">Public Key: (e, N)</text>
    <text x="125" y="315" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#F43F5E">Private Key: (d, N) or (p, q)</text>
  </g>

  <!-- Stage 2: Encryption (Sender) -->
  <rect x="360" y="95" width="280" height="400" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="360" y="95" width="280" height="42" rx="12" fill="url(#encGrad)" />
  <text x="500" y="122" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">
    2. Encryption (Sender)
  </text>

  <g transform="translate(375, 150)">
    <text x="0" y="15" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Plaintext Message M:</text>
    <rect x="0" y="25" width="250" height="30" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#FDE68A">"attack" → Integer M &lt; N</text>

    <text x="0" y="80" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Obtain Recipient's Public Key:</text>
    <rect x="0" y="90" width="250" height="30" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#38BDF8">Public Key: (e, N)</text>

    <text x="0" y="145" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Apply Encryption Formula:</text>
    <rect x="0" y="155" width="250" height="55" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="125" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FBBF24">C ≡ M^e (mod N)</text>
    <text x="125" y="198" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Fast Modular Exponentiation</text>

    <text x="0" y="235" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Transmit Ciphertext C:</text>
    <rect x="0" y="245" width="250" height="35" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#F87171">C sent over Insecure Network</text>
  </g>

  <!-- Stage 3: Decryption (Receiver) -->
  <rect x="680" y="95" width="280" height="400" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="680" y="95" width="280" height="42" rx="12" fill="url(#decGrad)" />
  <text x="820" y="122" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">
    3. Decryption (Receiver)
  </text>

  <g transform="translate(695, 150)">
    <text x="0" y="15" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Intercepted Ciphertext C:</text>
    <rect x="0" y="25" width="250" height="30" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="45" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#FCA5A5">Ciphertext C Received</text>

    <text x="0" y="80" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Apply Private Key d:</text>
    <rect x="0" y="90" width="250" height="55" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="125" y="113" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#34D399">M ≡ C^d (mod N)</text>
    <text x="125" y="133" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Using Extended Euclidean Inverse d</text>

    <text x="0" y="170" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Correctness Proof:</text>
    <rect x="0" y="180" width="250" height="75" rx="5" fill="#0F172A" stroke="#334155" />
    <text x="125" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#CBD5E1">C^d ≡ (M^e)^d ≡ M^(ed) (mod N)</text>
    <text x="125" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#CBD5E1">ed = k·φ(N) + 1</text>
    <text x="125" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#86EFAC">M^(k·φ(N)+1) ≡ 1^k · M ≡ M (mod N)</text>

    <text x="0" y="275" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Recovered Plaintext:</text>
    <rect x="0" y="285" width="250" height="30" rx="5" fill="#0F172A" stroke="#10B981" />
    <text x="125" y="305" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ADE80">"attack" (Decrypted!)</text>
  </g>

  <!-- Connectors -->
  <path d="M 325 290 L 355 290" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#rsaArrow)" />
  <path d="M 645 290 L 675 290" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#rsaArrow)" />
</svg>
