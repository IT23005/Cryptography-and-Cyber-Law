<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="950" height="480" fill="#0F172A" rx="16" />

  <text x="475" y="42" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">
    The Many-Time Pad Vulnerability (Two-Time Pad Attack)
  </text>
  <text x="475" y="66" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">
    Catastrophic Information Leakage Caused by Pad Re-use via XOR Linear Property
  </text>

  <!-- Mathematical Core Box -->
  <rect x="80" y="95" width="790" height="130" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)" />
  
  <text x="110" y="125" font-family="Consolas, monospace" font-size="14" fill="#93C5FD">Ciphertext 1:</text>
  <text x="240" y="125" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#60A5FA">C₁ = M₁ ⊕ K</text>
  <text x="450" y="125" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">(Message 1 encrypted with key K)</text>

  <text x="110" y="155" font-family="Consolas, monospace" font-size="14" fill="#93C5FD">Ciphertext 2:</text>
  <text x="240" y="155" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#60A5FA">C₂ = M₂ ⊕ K</text>
  <text x="450" y="155" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">(Message 2 encrypted with SAME key K!)</text>

  <line x1="110" y1="172" x2="840" y2="172" stroke="#475569" stroke-width="1" stroke-dasharray="4" />

  <text x="110" y="200" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#F87171">XOR of Ciphers:</text>
  <text x="240" y="200" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#F43F5E">C₁ ⊕ C₂ = (M₁ ⊕ K) ⊕ (M₂ ⊕ K) = M₁ ⊕ M₂</text>
  <text x="730" y="200" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#EF4444">Key K Cancels Out!</text>

  <!-- Crib Dragging Technique Box -->
  <rect x="80" y="245" width="790" height="205" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="80" y="245" width="790" height="35" rx="10" fill="#2563EB" />
  <text x="475" y="268" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">
    Cryptanalytic Exploitation: Crib Dragging
  </text>

  <g transform="translate(100, 295)">
    <text x="0" y="20" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">
      1. Eve intercepts <tspan font-family="Consolas" fill="#F43F5E">C₁</tspan> and <tspan font-family="Consolas" fill="#F43F5E">C₂</tspan>, and computes <tspan font-family="Consolas" fill="#FBBF24">Z = C₁ ⊕ C₂ = M₁ ⊕ M₂</tspan>.
    </text>
    <text x="0" y="50" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">
      2. Eve guesses common English words/cribs (e.g., <tspan font-family="Consolas" fill="#38BDF8">" the "</tspan>, <tspan font-family="Consolas" fill="#38BDF8">"attack"</tspan>, <tspan font-family="Consolas" fill="#38BDF8">"secret"</tspan>).
    </text>
    <text x="0" y="80" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">
      3. Eve XORs the crib with <tspan font-family="Consolas" fill="#FBBF24">Z</tspan> across all possible sliding character positions:
    </text>
    
    <rect x="20" y="95" width="710" height="42" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="375" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#A7F3D0">
      (C₁ ⊕ C₂) ⊕ Crib = (M₁ ⊕ M₂) ⊕ M₁ = M₂ (Readable English Revealed!)
    </text>
  </g>
</svg>
