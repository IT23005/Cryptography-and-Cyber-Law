<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="eeaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2" />
    </filter>
    <marker id="eeaArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8" />
    </marker>
  </defs>

  <rect width="950" height="480" fill="#0F172A" rx="16" />

  <text x="475" y="42" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">
    Extended Euclidean Algorithm &amp; Bézout's Identity
  </text>
  <text x="475" y="66" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" fill="#94A3B8">
    Computing Greatest Common Divisor and Coefficients d = gcd(a, b) = a·x + b·y
  </text>

  <!-- Step Boxes -->
  <!-- Box 1: Input -->
  <rect x="50" y="110" width="240" height="150" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="110" width="240" height="35" rx="10" fill="url(#eeaGrad)" />
  <text x="170" y="133" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1. Division Step</text>
  <text x="70" y="170" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">Given a ≥ b ≥ 0:</text>
  <text x="70" y="195" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FCD34D">a = q · b + r</text>
  <text x="70" y="220" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">q = a // b,  r = a % b</text>
  <text x="70" y="240" font-family="Consolas, monospace" font-size="12" fill="#A5B4FC">gcd(a, b) = gcd(b, r)</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 295 185 L 345 185" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#eeaArrow)" />

  <!-- Box 2: Recursion Base -->
  <rect x="355" y="110" width="240" height="150" rx="10" fill="#1E293B" stroke="#059669" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="355" y="110" width="240" height="35" rx="10" fill="#059669" />
  <text x="475" y="133" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">2. Base Case (b = 0)</text>
  <text x="375" y="170" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">When b reaches 0:</text>
  <text x="375" y="195" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#34D399">d = a,  x = 1,  y = 0</text>
  <text x="375" y="220" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">Because:</text>
  <text x="375" y="240" font-family="Consolas, monospace" font-size="12" fill="#86EFAC">gcd(a, 0) = a = a·(1) + 0·(0)</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 600 185 L 650 185" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#eeaArrow)" />

  <!-- Box 3: Back-substitution -->
  <rect x="660" y="110" width="240" height="150" rx="10" fill="#1E293B" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="660" y="110" width="240" height="35" rx="10" fill="#D97706" />
  <text x="780" y="133" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">3. Unwinding Recurrence</text>
  <text x="680" y="170" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">From child (x₁, y₁):</text>
  <text x="680" y="195" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FBBF24">x = y₁</text>
  <text x="680" y="220" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#FBBF24">y = x₁ - (a // b) · y₁</text>
  <text x="680" y="242" font-family="Consolas, monospace" font-size="11" fill="#FDE68A">Complexity: O(log(min(a,b)))</text>

  <!-- Lower Panel: Applications -->
  <rect x="50" y="290" width="850" height="155" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="475" y="320" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#38BDF8">
    Critical Cryptographic Applications of Extended GCD
  </text>

  <g transform="translate(80, 345)">
    <!-- App 1 -->
    <rect x="0" y="0" width="240" height="80" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="120" y="25" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#60A5FA">Modular Inverse</text>
    <text x="120" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">a·x ≡ 1 (mod n)</text>
    <text x="120" y="68" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Basis for RSA private key d</text>

    <!-- App 2 -->
    <rect x="275" y="0" width="240" height="80" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="395" y="25" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#34D399">Linear Diophantine</text>
    <text x="395" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">a·x + b·y = c</text>
    <text x="395" y="68" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Solvable iff gcd(a, b) | c</text>

    <!-- App 3 -->
    <rect x="550" y="0" width="240" height="80" rx="6" fill="#0F172A" stroke="#334155" />
    <text x="670" y="25" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FBBF24">Chinese Remainder (CRT)</text>
    <text x="670" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">r ≡ r₁ (mod n₁), r ≡ r₂ (mod n₂)</text>
    <text x="670" y="68" text-anchor="middle" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Reconstructing shared congruences</text>
  </g>
</svg>
